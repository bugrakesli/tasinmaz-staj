<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Taşınmazlarım</h1>
    <div class="d-flex gap-2">
      <button *ngIf="!isAdmin()" class="btn btn-primary btn-sm" (click)="addNew()">
        Yeni Taşınmaz Ekle
      </button>
      <button class="btn btn-outline-danger btn-sm" (click)="logout()">Çıkış Yap</button>
    </div>
  </div>

  <div *ngIf="loading()" class="alert alert-info">Yükleniyor...</div>
  <div *ngIf="errorMessage()" class="alert alert-danger">{{ errorMessage() }}</div>

  <table *ngIf="!loading() && !errorMessage()" class="table table-striped table-hover align-middle">
    <thead>
      <tr>
        <th>Şehir</th>
        <th>İlçe</th>
        <th>Mahalle</th>
        <th>Ada No</th>
        <th>Parsel No</th>
        <th>Adres</th>
        <th>Tip</th>
        <th *ngIf="!isAdmin()" class="text-end">İşlemler</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of properties()">
        <td>{{ p.city }}</td>
        <td>{{ p.district }}</td>
        <td>{{ p.neighborhood }}</td>
        <td>{{ p.adaNo }}</td>
        <td>{{ p.parselNo }}</td>
        <td>{{ p.adres }}</td>
        <td>{{ p.propertyType }}</td>
        <td *ngIf="!isAdmin()" class="text-end">
          <button
            class="btn btn-outline-secondary btn-sm me-2"
            (click)="edit(p)"
          >
            Düzenle
          </button>
          <button
            class="btn btn-outline-danger btn-sm"
            [disabled]="deletingId() === p.id"
            (click)="remove(p)"
          >
            {{ deletingId() === p.id ? 'Siliniyor...' : 'Sil' }}
          </button>
        </td>
      </tr>
      <tr *ngIf="properties().length === 0">
        <td [attr.colspan]="isAdmin() ? 7 : 8" class="text-center text-muted">
          Henüz taşınmaz kaydı yok.
        </td>
      </tr>
    </tbody>
  </table>
</div>
