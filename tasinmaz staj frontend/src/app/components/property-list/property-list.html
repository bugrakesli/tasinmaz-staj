<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Taşınmazlarım</h1>
    <button class="btn btn-outline-danger btn-sm" (click)="logout()">Çıkış Yap</button>
  </div>

  <div *ngIf="loading" class="alert alert-info">Yükleniyor...</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <table *ngIf="!loading && !errorMessage" class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Şehir</th>
        <th>İlçe</th>
        <th>Mahalle</th>
        <th>Ada No</th>
        <th>Parsel No</th>
        <th>Adres</th>
        <th>Tip</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of properties">
        <td>{{ p.city }}</td>
        <td>{{ p.district }}</td>
        <td>{{ p.neighborhood }}</td>
        <td>{{ p.adaNo }}</td>
        <td>{{ p.parselNo }}</td>
        <td>{{ p.adres }}</td>
        <td>{{ p.propertyType }}</td>
      </tr>
      <tr *ngIf="properties.length === 0">
        <td colspan="7" class="text-center text-muted">Henüz taşınmaz kaydı yok.</td>
      </tr>
    </tbody>
  </table>
</div>
