<div class="map-draw-wrapper">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <small class="text-muted">{{ drawHint() }}</small>
    @if (hasGeometry()) {
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="clear()">
        Poligonu Temizle
      </button>
    }
  </div>

  <!-- 4.3: Altlık harita seçimi ve katman şeffaflığı -->
  <div class="map-toolbar d-flex flex-wrap gap-3 align-items-center mb-2">
    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small" [class.fw-bold]="basemap() === 'osm'" [class.text-dark]="basemap() === 'osm'" style="cursor: pointer" (click)="setBasemap('osm')">OSM</span>
      <div class="form-check form-switch mb-0 p-0 d-flex align-items-center">
        <input 
          class="form-check-input m-0" 
          type="checkbox" 
          role="switch"
          [checked]="basemap() === 'google'"
          (change)="setBasemap($any($event.target).checked ? 'google' : 'osm')"
          style="cursor: pointer; width: 2.5em; height: 1.25em;"
        >
      </div>
      <span class="text-muted small" [class.fw-bold]="basemap() === 'google'" [class.text-dark]="basemap() === 'google'" style="cursor: pointer" (click)="setBasemap('google')">Google Maps</span>
    </div>

    <div class="d-flex align-items-center gap-2 opacity-control">
      <label for="mapOpacity" class="form-label text-muted mb-0 small">Katman Şeffaflığı</label>
      <input
        id="mapOpacity"
        type="range"
        class="form-range"
        min="10"
        max="100"
        step="5"
        [value]="opacityPercent()"
        (input)="setOpacity($any($event.target).valueAsNumber)" />
      <span class="text-muted small">{{ opacityPercent() }}%</span>
    </div>

    @if (hasIntersection()) {
      <span class="badge intersection-badge">
        <span class="intersection-swatch"></span>
        Çakışan Alan
      </span>
    }
  </div>

  <div #mapContainer class="map-draw-container"></div>
</div>
