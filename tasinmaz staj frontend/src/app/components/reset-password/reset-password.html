<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-2">Yeni Şifre Belirle</h1>
          <p class="text-muted mb-4">
            Yeni şifrenizi belirleyin.
          </p>

          @if (errorMessage()) {
            <div class="alert alert-danger">{{ errorMessage() }}</div>
          }

          @if (successMessage()) {
            <div class="alert alert-success">{{ successMessage() }}</div>
            <a routerLink="/login" class="btn btn-primary w-100">
              Giriş Sayfasına Dön
            </a>
          } @else {
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
              <div class="mb-3">
                <label for="new-password" class="form-label">Yeni Şifre</label>
                <input
                  id="new-password"
                  type="password"
                  autocomplete="new-password"
                  class="form-control"
                  formControlName="password"
                  placeholder="Yeni şifreniz"
                >
                <div class="form-text">
                  8-12 karakter; en az bir harf, bir rakam ve bir özel karakter.
                </div>
              </div>

              <div class="mb-4">
                <label for="confirm-password" class="form-label">Yeni Şifre (Tekrar)</label>
                <input
                  id="confirm-password"
                  type="password"
                  autocomplete="new-password"
                  class="form-control"
                  formControlName="confirmPassword"
                  placeholder="Şifrenizi tekrar girin"
                >
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Şifreyi Sıfırla
              </button>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
