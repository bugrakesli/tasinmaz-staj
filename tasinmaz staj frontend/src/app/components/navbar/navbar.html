<nav class="navbar navbar-expand-lg navbar-dark app-navbar mb-4" *ngIf="isAuthenticated">
  <div class="container-fluid page-container py-2">
    <a class="navbar-brand d-flex align-items-center" routerLink="/properties">
      <span class="brand-icon me-2"><i class="bi bi-building"></i></span>
      <span class="d-none d-sm-inline">Taşınmaz Yönetim Sistemi</span>
      <span class="d-inline d-sm-none">TYS</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/properties" routerLinkActive="active">
            <i class="bi bi-list-ul me-1"></i>Taşınmazlar
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/analysis" routerLinkActive="active">
            <i class="bi bi-graph-up me-1"></i>Analiz
          </a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link" routerLink="/users" routerLinkActive="active">
            <i class="bi bi-people me-1"></i>Kullanıcılar
          </a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link" routerLink="/logs" routerLinkActive="active">
            <i class="bi bi-journal-text me-1"></i>Loglar
          </a>
        </li>
      </ul>

        <div class="user-chip d-flex align-items-center">
          <i class="bi bi-person-circle me-2"></i>
